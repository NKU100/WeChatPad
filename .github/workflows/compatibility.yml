name: Check WeChat compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
      source_url: ${{ steps.discover.outputs.source_url }}
      expected_sha256: ${{ steps.discover.outputs.expected_sha256 }}
      cache_dir: ${{ steps.discover.outputs.cache_dir }}
      cache_key: ${{ steps.discover.outputs.cache_key }}
      version_code_hint: ${{ steps.discover.outputs.version_code_hint }}
      pipeline_status: ${{ steps.preparation-failure.outputs.pipeline_status }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test official candidate discovery and cache validation
        run: python3 -m unittest scripts.test_discover_latest_wechat

      - name: Test latest-three compatibility window selection
        run: python3 -m unittest scripts.test_select_compatibility_window

      - name: Validate target manifest
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            type == "array" and length > 0 and
            all(.[];
              .identity.packageName == "com.tencent.mm" and
              ((.identity.versionName | type) == "string") and
              (.identity.versionName | length > 0 and test("^[0-9.]+") and all(explode[]; . == 46 or (. >= 48 and . <= 57)) and (contains("..") | not) and (endswith(".") | not)) and
              ((.identity.versionCode | type) == "number") and
              (.identity.abi == "arm64-v8a") and
              ((.identity.apkSha256 | type) == "string") and
              (.identity.apkSha256 | length == 64 and test("^[A-Fa-f0-9]{64}")) and
              ((.identity.signerSha256 | type) == "string") and
              (.identity.signerSha256 | length == 64 and test("^[A-Fa-f0-9]{64}")) and
              ((.sourceUrl | type) == "string") and
              (.sourceUrl | startswith("https://dldir1v6.qq.com/weixin/android/") and endswith(".apk") and (split("/") | length == 6))
            )
          ' compatibility/targets.json >/dev/null

      - name: Prepare official candidate diagnostic
        run: |
          mkdir -p compatibility-report
          printf '# Latest official WeChat ARM64 compatibility check\n\n' \
            > compatibility-report/latest-official.md

      - name: Discover latest official ARM64 APK
        id: discover
        run: |
          python3 -m scripts.ci.discover_latest_wechat \
            --targets compatibility/targets.json \
            --github-output "$GITHUB_OUTPUT" \
            --report compatibility-report/latest-official.md

      - name: Select the latest-three regression window
        id: targets
        env:
          WECHAT_CANDIDATE_VERSION_CODE: ${{ steps.discover.outputs.version_code_hint }}
        run: |
          python3 -m scripts.ci.select_compatibility_window \
            --targets compatibility/targets.json \
            --candidate-version-code "$WECHAT_CANDIDATE_VERSION_CODE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record candidate preparation failure
        id: preparation-failure
        if: failure()
        env:
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
          DISCOVERY_RESULT: ${{ steps.discover.outcome }}
          TARGET_SELECTION_RESULT: ${{ steps.targets.outcome }}
          WECHAT_APK_URL: ${{ steps.discover.outputs.source_url }}
          WECHAT_TARGET_MATRIX: ${{ steps.targets.outputs.matrix || '[]' }}
        run: |
          status=STATIC_REGRESSION_FAILED
          reason='Compatibility preparation failed before candidate analysis.'
          if [[ "$VALIDATION_RESULT" == 'failure' || "$TARGET_SELECTION_RESULT" == 'failure' ]]; then
            status=BASELINE_INVALID
            reason='Compatibility target manifest or regression window is invalid.'
          elif [[ "$DISCOVERY_RESULT" == 'failure' ]]; then
            status=FETCH_FAILED
            reason='Official WeChat candidate discovery failed.'
          fi
          checked_versions="$(jq -r '[.[].version_name] | join(",")' <<< "$WECHAT_TARGET_MATRIX")"
          python3 -m scripts.ci.write_candidate_failure_report \
            --report compatibility-report/candidate-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --status "$status" \
            --reason "$reason" \
            --source-url "$WECHAT_APK_URL" \
            --checked-versions "$checked_versions"
          {
            echo '## Candidate pipeline'
            echo "- Status: $status"
            echo "- Blocked: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate preparation failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-candidate-preparation-failure
          path: |
            compatibility-report/candidate-report.json
            compatibility-report/latest-official.md
          if-no-files-found: warn
          retention-days: 14

  check:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Prepare APK cache and diagnostic report
        env:
          WECHAT_VERSION: ${{ matrix.target.version_name }}
          WECHAT_VERSION_CODE: ${{ matrix.target.version_code }}
          WECHAT_APK_SHA256: ${{ matrix.target.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .cache/wechat-apks compatibility-report
          printf '# WeChat %s (%s) compatibility check\n\nExpected APK SHA-256: %s\n\n' \
            "$WECHAT_VERSION" "$WECHAT_VERSION_CODE" "$WECHAT_APK_SHA256" \
            > "compatibility-report/$WECHAT_VERSION.md"

      - name: Restore APK by SHA-256
        uses: actions/cache@v6
        with:
          path: .cache/wechat-apks/${{ matrix.target.sha256 }}.apk
          key: wechatpad-apk-${{ matrix.target.sha256 }}

      - name: Download and verify official APK
        env:
          WECHAT_VERSION: ${{ matrix.target.version_name }}
          WECHAT_APK_SHA256: ${{ matrix.target.sha256 }}
          WECHAT_APK_URL: ${{ matrix.target.source_url }}
        shell: bash
        run: |
          set -euo pipefail

          apk_path=".cache/wechat-apks/$WECHAT_APK_SHA256.apk"
          report="compatibility-report/$WECHAT_VERSION.md"
          printf 'Source: %s\n\n' "$WECHAT_APK_URL" >> "$report"

          if [[ -f "$apk_path" ]] && printf '%s  %s\n' "$WECHAT_APK_SHA256" "$apk_path" | sha256sum --check --status; then
            echo 'APK cache hit; SHA-256 verified.' | tee -a "$report"
            exit 0
          fi

          echo 'Downloading the APK from the Tencent CDN.' | tee -a "$report"
          download_path="$RUNNER_TEMP/wechatpad-$WECHAT_APK_SHA256.apk"
          if ! curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 20 --max-time 600 \
            --proto '=https' --proto-redir '=https' \
            --output "$download_path" "$WECHAT_APK_URL"; then
            echo 'Download failed.' | tee -a "$report"
            exit 1
          fi

          if ! printf '%s  %s\n' "$WECHAT_APK_SHA256" "$download_path" | sha256sum --check --status; then
            actual_sha256="$(sha256sum "$download_path" | cut -d ' ' -f 1)"
            printf 'SHA-256 mismatch. Expected %s; received %s.\n' \
              "$WECHAT_APK_SHA256" "$actual_sha256" | tee -a "$report"
            exit 1
          fi

          install -m 0644 "$download_path" "$apk_path"
          echo 'Downloaded APK SHA-256 verified and cached.' | tee -a "$report"

      - name: Run shared compatibility checker
        id: compatibility
        continue-on-error: true
        env:
          WECHAT_VERSION: ${{ matrix.target.version_name }}
          WECHAT_APK_SHA256: ${{ matrix.target.sha256 }}
        shell: bash
        run: |
          set -uo pipefail

          report="compatibility-report/$WECHAT_VERSION.md"
          apk_path=".cache/wechat-apks/$WECHAT_APK_SHA256.apk"
          printf '\n## Shared compat-core result\n\n' >> "$report"

          set +e
          ./gradlew --no-daemon :compat-checker:run \
            --args="check --targets compatibility/targets.json --apk $apk_path" \
            2>&1 | tee -a "$report"
          checker_status=${PIPESTATUS[0]}
          set -e

          if [[ "$checker_status" -eq 0 ]]; then
            printf '\nStatic compatibility check passed.\n' >> "$report"
          else
            printf '\nStatic compatibility check failed with exit code %s.\n' "$checker_status" >> "$report"
          fi
          exit "$checker_status"

      - name: Upload compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-compatibility-${{ matrix.target.version_name }}
          path: compatibility-report/${{ matrix.target.version_name }}.md
          if-no-files-found: warn
          retention-days: 14

      - name: Mark checker failure
        if: steps.compatibility.outcome == 'failure'
        run: exit 1

  latest:
    name: Check latest official APK
    needs: [prepare, check]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      pipeline_status: ${{ steps.latest-compatibility.outputs.pipeline_status || steps.candidate-failure.outputs.pipeline_status }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Test shared compatibility core
        run: ./gradlew --no-daemon :compat-core:test :compat-checker:test

      - name: Prepare latest candidate diagnostic
        run: |
          mkdir -p compatibility-report
          printf '# Latest official WeChat ARM64 compatibility check\n\n' \
            > compatibility-report/latest-official.md

      - name: Prepare latest candidate cache
        env:
          WECHAT_APK_CACHE_DIR: ${{ needs.prepare.outputs.cache_dir }}
        run: mkdir -p "$WECHAT_APK_CACHE_DIR"

      - name: Restore latest candidate by official URL
        uses: actions/cache@v6
        with:
          path: ${{ needs.prepare.outputs.cache_dir }}
          key: ${{ needs.prepare.outputs.cache_key }}

      - name: Download and verify latest candidate
        id: candidate
        env:
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_APK_CACHE_DIR: ${{ needs.prepare.outputs.cache_dir }}
          WECHAT_APK_EXPECTED_SHA256: ${{ needs.prepare.outputs.expected_sha256 }}
        run: |
          python3 -m scripts.ci.fetch_latest_wechat_apk \
            --url "$WECHAT_APK_URL" \
            --cache-dir "$WECHAT_APK_CACHE_DIR" \
            --expected-sha256 "$WECHAT_APK_EXPECTED_SHA256" \
            --github-output "$GITHUB_OUTPUT" \
            --report compatibility-report/latest-official.md

      - name: Run shared compatibility checker on latest candidate
        id: latest-compatibility
        env:
          WECHAT_APK_PATH: ${{ steps.candidate.outputs.apk_path }}
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_TARGET_MATRIX: ${{ needs.prepare.outputs.targets }}
          WECHAT_REGRESSION_PASSED: ${{ needs.check.result != 'failure' && needs.check.result != 'cancelled' }}
        shell: bash
        run: |
          set -euo pipefail
          checked_versions="$(jq -r '[.[].version_name] | join(",")' <<< "$WECHAT_TARGET_MATRIX")"
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            profile_merged_to_main=true
          else
            profile_merged_to_main=false
          fi

          ./gradlew --no-daemon :compat-checker:run \
            --args="analyze-candidate --targets compatibility/targets.json --apk '$WECHAT_APK_PATH' --source-url '$WECHAT_APK_URL' --checked-versions '$checked_versions' --regression-passed '$WECHAT_REGRESSION_PASSED' --profile-merged-to-main '$profile_merged_to_main' --report compatibility-report/candidate-report.json" \
            2>&1 | tee -a compatibility-report/latest-official.md

      - name: Record candidate analysis failure
        id: candidate-failure
        if: failure() && steps.latest-compatibility.outcome != 'success'
        env:
          DOWNLOAD_RESULT: ${{ steps.candidate.outcome }}
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_TARGET_MATRIX: ${{ needs.prepare.outputs.targets }}
        run: |
          if [[ -f compatibility-report/candidate-report.json ]]; then
            exit 0
          fi
          status=STATIC_REGRESSION_FAILED
          reason='Static candidate analysis could not complete.'
          if [[ "$DOWNLOAD_RESULT" == 'failure' ]]; then
            status=FETCH_FAILED
            reason='Official candidate APK download or integrity verification failed.'
          fi
          checked_versions="$(jq -r '[.[].version_name] | join(",")' <<< "$WECHAT_TARGET_MATRIX")"
          python3 -m scripts.ci.write_candidate_failure_report \
            --report compatibility-report/candidate-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --status "$status" \
            --reason "$reason" \
            --source-url "$WECHAT_APK_URL" \
            --checked-versions "$checked_versions"

      - name: Add pipeline result to the Actions summary
        if: always() && hashFiles('compatibility-report/candidate-report.json') != ''
        run: |
          {
            echo '## Candidate pipeline'
            jq -r '"- Status: " + .status + "\n- Candidate: " + ((.identity.versionName // "unknown") + " (" + ((.identity.versionCode // "unknown") | tostring) + ")") + "\n- Baseline: " + (.baselineVersion // "none") + "\n- Checked builds: " + (.checkedVersions | join(", "))' compatibility-report/candidate-report.json
            echo
            echo '## Hook findings'
            jq -r '.hooks[]? | "- " + .hookId + ": " + .status + " — " + (if (.selectedDescriptor // "") != "" then .selectedDescriptor elif (.candidateDescriptors | length) > 0 then (.candidateDescriptors | join(", ")) else .message end)' compatibility-report/candidate-report.json
            jq -r '.blockers[]? | "- Blocked: " + .' compatibility-report/candidate-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload latest candidate diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-latest-official-candidate
          path: |
            compatibility-report/candidate-report.json
            compatibility-report/latest-official.md
          if-no-files-found: warn
          retention-days: 14
