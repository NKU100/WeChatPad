name: Check WeChat compatibility

on:
  workflow_dispatch:
    inputs:
      run_codex:
        description: Adapt verified unknown builds with gpt-6-luna/xhigh (one attempt)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
      source_url: ${{ steps.discover.outputs.source_url }}
      expected_sha256: ${{ steps.discover.outputs.expected_sha256 }}
      cache_dir: ${{ steps.discover.outputs.cache_dir }}
      cache_key: ${{ steps.discover.outputs.cache_key }}
      version_code_hint: ${{ steps.discover.outputs.version_code_hint }}
      pipeline_status: ${{ steps.preparation-failure.outputs.pipeline_status }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test official candidate discovery and cache validation
        run: python3 -m unittest scripts.test_discover_latest_wechat

      - name: Test latest-three compatibility window selection
        run: python3 -m unittest scripts.test_select_compatibility_window

      - name: Test Codex eligibility, edit guards, timeout, and deduplication
        run: python3 -m unittest scripts.test_codex_adaptation scripts.test_codex_task

      - name: Validate target manifest
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            type == "array" and length > 0 and
            all(.[];
              .identity.packageName == "com.tencent.mm" and
              ((.identity.versionName | type) == "string") and
              (.identity.versionName | length > 0 and test("^[0-9.]+") and all(explode[]; . == 46 or (. >= 48 and . <= 57)) and (contains("..") | not) and (endswith(".") | not)) and
              ((.identity.versionCode | type) == "number") and
              (.identity.abi == "arm64-v8a") and
              ((.identity.apkSha256 | type) == "string") and
              (.identity.apkSha256 | length == 64 and test("^[A-Fa-f0-9]{64}")) and
              ((.identity.signerSha256 | type) == "string") and
              (.identity.signerSha256 | length == 64 and test("^[A-Fa-f0-9]{64}")) and
              ((.sourceUrl | type) == "string") and
              (.sourceUrl | startswith("https://dldir1v6.qq.com/weixin/android/") and endswith(".apk") and (split("/") | length == 6))
            )
          ' compatibility/targets.json >/dev/null

      - name: Prepare official candidate diagnostic
        run: |
          mkdir -p compatibility-report
          printf '# Latest official WeChat ARM64 compatibility check\n\n' \
            > compatibility-report/latest-official.md

      - name: Discover latest official ARM64 APK
        id: discover
        run: |
          python3 -m scripts.ci.discover_latest_wechat \
            --targets compatibility/targets.json \
            --github-output "$GITHUB_OUTPUT" \
            --report compatibility-report/latest-official.md

      - name: Select the latest-three regression window
        id: targets
        env:
          WECHAT_CANDIDATE_VERSION_CODE: ${{ steps.discover.outputs.version_code_hint }}
        run: |
          python3 -m scripts.ci.select_compatibility_window \
            --targets compatibility/targets.json \
            --candidate-version-code "$WECHAT_CANDIDATE_VERSION_CODE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record candidate preparation failure
        id: preparation-failure
        if: failure()
        env:
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
          DISCOVERY_RESULT: ${{ steps.discover.outcome }}
          TARGET_SELECTION_RESULT: ${{ steps.targets.outcome }}
          WECHAT_APK_URL: ${{ steps.discover.outputs.source_url }}
          WECHAT_TARGET_MATRIX: ${{ steps.targets.outputs.matrix || '[]' }}
        run: |
          status=STATIC_REGRESSION_FAILED
          reason='Compatibility preparation failed before candidate analysis.'
          if [[ "$VALIDATION_RESULT" == 'failure' || "$TARGET_SELECTION_RESULT" == 'failure' ]]; then
            status=BASELINE_INVALID
            reason='Compatibility target manifest or regression window is invalid.'
          elif [[ "$DISCOVERY_RESULT" == 'failure' ]]; then
            status=FETCH_FAILED
            reason='Official WeChat candidate discovery failed.'
          fi
          checked_versions="$(jq -r '[.[].version_name] | join(",")' <<< "$WECHAT_TARGET_MATRIX")"
          python3 -m scripts.ci.write_candidate_failure_report \
            --report compatibility-report/candidate-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --status "$status" \
            --reason "$reason" \
            --source-url "$WECHAT_APK_URL" \
            --checked-versions "$checked_versions"
          {
            echo '## Candidate pipeline'
            echo "- Status: $status"
            echo "- Blocked: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate preparation failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-candidate-preparation-failure
          path: |
            compatibility-report/candidate-report.json
            compatibility-report/latest-official.md
          if-no-files-found: warn
          retention-days: 14

  check:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Prepare APK cache and diagnostic report
        env:
          WECHAT_VERSION: ${{ matrix.target.version_name }}
          WECHAT_VERSION_CODE: ${{ matrix.target.version_code }}
          WECHAT_APK_SHA256: ${{ matrix.target.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .cache/wechat-apks compatibility-report
          printf '# WeChat %s (%s) compatibility check\n\nExpected APK SHA-256: %s\n\n' \
            "$WECHAT_VERSION" "$WECHAT_VERSION_CODE" "$WECHAT_APK_SHA256" \
            > "compatibility-report/$WECHAT_VERSION.md"

      - name: Restore APK by SHA-256
        uses: actions/cache@v6
        with:
          path: .cache/wechat-apks/${{ matrix.target.sha256 }}.apk
          key: wechatpad-apk-${{ matrix.target.sha256 }}

      - name: Download and verify official APK
        env:
          WECHAT_VERSION: ${{ matrix.target.version_name }}
          WECHAT_APK_SHA256: ${{ matrix.target.sha256 }}
          WECHAT_APK_URL: ${{ matrix.target.source_url }}
        shell: bash
        run: |
          set -euo pipefail

          apk_path=".cache/wechat-apks/$WECHAT_APK_SHA256.apk"
          report="compatibility-report/$WECHAT_VERSION.md"
          printf 'Source: %s\n\n' "$WECHAT_APK_URL" >> "$report"

          if [[ -f "$apk_path" ]] && printf '%s  %s\n' "$WECHAT_APK_SHA256" "$apk_path" | sha256sum --check --status; then
            echo 'APK cache hit; SHA-256 verified.' | tee -a "$report"
            exit 0
          fi

          echo 'Downloading the APK from the Tencent CDN.' | tee -a "$report"
          download_path="$RUNNER_TEMP/wechatpad-$WECHAT_APK_SHA256.apk"
          if ! curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 20 --max-time 600 \
            --proto '=https' --proto-redir '=https' \
            --output "$download_path" "$WECHAT_APK_URL"; then
            echo 'Download failed.' | tee -a "$report"
            exit 1
          fi

          if ! printf '%s  %s\n' "$WECHAT_APK_SHA256" "$download_path" | sha256sum --check --status; then
            actual_sha256="$(sha256sum "$download_path" | cut -d ' ' -f 1)"
            printf 'SHA-256 mismatch. Expected %s; received %s.\n' \
              "$WECHAT_APK_SHA256" "$actual_sha256" | tee -a "$report"
            exit 1
          fi

          install -m 0644 "$download_path" "$apk_path"
          echo 'Downloaded APK SHA-256 verified and cached.' | tee -a "$report"

      - name: Run shared compatibility checker
        id: compatibility
        continue-on-error: true
        env:
          WECHAT_VERSION: ${{ matrix.target.version_name }}
          WECHAT_APK_SHA256: ${{ matrix.target.sha256 }}
        shell: bash
        run: |
          set -uo pipefail

          report="compatibility-report/$WECHAT_VERSION.md"
          apk_path=".cache/wechat-apks/$WECHAT_APK_SHA256.apk"
          printf '\n## Shared compat-core result\n\n' >> "$report"

          set +e
          ./gradlew --no-daemon :compat-checker:run \
            --args="check --targets compatibility/targets.json --apk $apk_path" \
            2>&1 | tee -a "$report"
          checker_status=${PIPESTATUS[0]}
          set -e

          if [[ "$checker_status" -eq 0 ]]; then
            printf '\nStatic compatibility check passed.\n' >> "$report"
          else
            printf '\nStatic compatibility check failed with exit code %s.\n' "$checker_status" >> "$report"
          fi
          exit "$checker_status"

      - name: Upload compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-compatibility-${{ matrix.target.version_name }}
          path: compatibility-report/${{ matrix.target.version_name }}.md
          if-no-files-found: warn
          retention-days: 14

      - name: Mark checker failure
        if: steps.compatibility.outcome == 'failure'
        run: exit 1

  latest:
    name: Check latest official APK
    needs: [prepare, check]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      pipeline_status: ${{ steps.latest-compatibility.outputs.pipeline_status || steps.candidate-failure.outputs.pipeline_status }}
      adaptation_eligible: ${{ steps.adaptation-eligibility.outputs.adaptation_eligible }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Test shared compatibility core
        run: ./gradlew --no-daemon :compat-core:test :compat-checker:test

      - name: Prepare latest candidate diagnostic
        run: |
          mkdir -p compatibility-report
          printf '# Latest official WeChat ARM64 compatibility check\n\n' \
            > compatibility-report/latest-official.md

      - name: Prepare latest candidate cache
        env:
          WECHAT_APK_CACHE_DIR: ${{ needs.prepare.outputs.cache_dir }}
        run: mkdir -p "$WECHAT_APK_CACHE_DIR"

      - name: Restore latest candidate by official URL
        uses: actions/cache@v6
        with:
          path: ${{ needs.prepare.outputs.cache_dir }}
          key: ${{ needs.prepare.outputs.cache_key }}

      - name: Download and verify latest candidate
        id: candidate
        env:
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_APK_CACHE_DIR: ${{ needs.prepare.outputs.cache_dir }}
          WECHAT_APK_EXPECTED_SHA256: ${{ needs.prepare.outputs.expected_sha256 }}
        run: |
          python3 -m scripts.ci.fetch_latest_wechat_apk \
            --url "$WECHAT_APK_URL" \
            --cache-dir "$WECHAT_APK_CACHE_DIR" \
            --expected-sha256 "$WECHAT_APK_EXPECTED_SHA256" \
            --github-output "$GITHUB_OUTPUT" \
            --report compatibility-report/latest-official.md

      - name: Run shared compatibility checker on latest candidate
        id: latest-compatibility
        env:
          WECHAT_APK_PATH: ${{ steps.candidate.outputs.apk_path }}
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_TARGET_MATRIX: ${{ needs.prepare.outputs.targets }}
          WECHAT_REGRESSION_PASSED: ${{ needs.check.result != 'failure' && needs.check.result != 'cancelled' }}
        shell: bash
        run: |
          set -euo pipefail
          checked_versions="$(jq -r '[.[].version_name] | join(",")' <<< "$WECHAT_TARGET_MATRIX")"
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            profile_merged_to_main=true
          else
            profile_merged_to_main=false
          fi

          ./gradlew --no-daemon :compat-checker:run \
            --args="analyze-candidate --targets compatibility/targets.json --apk '$WECHAT_APK_PATH' --source-url '$WECHAT_APK_URL' --checked-versions '$checked_versions' --regression-passed '$WECHAT_REGRESSION_PASSED' --profile-merged-to-main '$profile_merged_to_main' --report compatibility-report/candidate-report.json" \
            2>&1 | tee -a compatibility-report/latest-official.md

      - name: Determine whether Codex should adapt this build
        id: adaptation-eligibility
        run: |
          python3 -m scripts.ci.codex_adaptation eligibility \
            --repository . \
            --report compatibility-report/candidate-report.json

      - name: Record candidate analysis failure
        id: candidate-failure
        if: failure() && steps.latest-compatibility.outcome != 'success'
        env:
          DOWNLOAD_RESULT: ${{ steps.candidate.outcome }}
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_TARGET_MATRIX: ${{ needs.prepare.outputs.targets }}
        run: |
          if [[ -f compatibility-report/candidate-report.json ]]; then
            exit 0
          fi
          status=STATIC_REGRESSION_FAILED
          reason='Static candidate analysis could not complete.'
          if [[ "$DOWNLOAD_RESULT" == 'failure' ]]; then
            status=FETCH_FAILED
            reason='Official candidate APK download or integrity verification failed.'
          fi
          checked_versions="$(jq -r '[.[].version_name] | join(",")' <<< "$WECHAT_TARGET_MATRIX")"
          python3 -m scripts.ci.write_candidate_failure_report \
            --report compatibility-report/candidate-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --status "$status" \
            --reason "$reason" \
            --source-url "$WECHAT_APK_URL" \
            --checked-versions "$checked_versions"

      - name: Add pipeline result to the Actions summary
        if: always() && hashFiles('compatibility-report/candidate-report.json') != ''
        run: |
          {
            echo '## Candidate pipeline'
            jq -r '"- Status: " + .status + "\n- Candidate: " + ((.identity.versionName // "unknown") + " (" + ((.identity.versionCode // "unknown") | tostring) + ")") + "\n- Baseline: " + (.baselineVersion // "none") + "\n- Checked builds: " + (.checkedVersions | join(", "))' compatibility-report/candidate-report.json
            echo
            echo '## Hook findings'
            jq -r '.hooks[]? | "- " + .hookId + ": " + .status + " — " + (if (.selectedDescriptor // "") != "" then .selectedDescriptor elif (.candidateDescriptors | length) > 0 then (.candidateDescriptors | join(", ")) else .message end)' compatibility-report/candidate-report.json
            jq -r '.blockers[]? | "- Blocked: " + .' compatibility-report/candidate-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload latest candidate diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-latest-official-candidate
          path: |
            compatibility-report/candidate-report.json
            compatibility-report/latest-official.md
          if-no-files-found: warn
          retention-days: 14

  adapt:
    name: Adapt unknown build with Codex
    needs: [prepare, check, latest]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && inputs.run_codex &&
      needs.latest.result == 'success' && needs.latest.outputs.adaptation_eligible == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: wechatpad-codex-managed-auth
      cancel-in-progress: false
    outputs:
      pipeline_status: ${{ steps.publish.outputs.pipeline_status || steps.adaptation-failure.outputs.pipeline_status }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
      head_sha: ${{ steps.publish.outputs.head_sha }}
      issue: ${{ steps.claim.outputs.issue }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out trusted pipeline source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted trigger and authentication configuration
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Managed authentication requires a manual main-branch run.'; exit 1; }
          [[ -n "$CODEX_AUTH_JSON" && -n "$GH_TOKEN" ]] || { echo 'Configure CODEX_AUTH_JSON and CODEX_AUTH_WRITE_TOKEN before starting Codex.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" >/dev/null

      - name: Download verified candidate report
        uses: actions/download-artifact@v8
        with:
          name: wechatpad-latest-official-candidate
          path: compatibility-report

      - name: Freeze adaptation controller outside agent checkout
        run: |
          CONTROLLER_ROOT="$RUNNER_TEMP/wechatpad-trusted"
          CODEX_TASK_DIR="$RUNNER_TEMP/wechatpad-adaptation"
          mkdir -p "$CONTROLLER_ROOT" "$CODEX_TASK_DIR"
          {
            echo "CONTROLLER_ROOT=$CONTROLLER_ROOT"
            echo "CODEX_TASK_DIR=$CODEX_TASK_DIR"
            echo "PYTHONPATH=$CONTROLLER_ROOT"
          } >> "$GITHUB_ENV"
          cp -R scripts "$CONTROLLER_ROOT/scripts"
          cp .github/codex/adapt-wechat.md "$CONTROLLER_ROOT/adapt-wechat.md"

      - name: Claim one adaptation attempt for this APK
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task claim \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json" \
            --targets "$GITHUB_WORKSPACE/compatibility/targets.json" \
            --directory "$CODEX_TASK_DIR"

      - name: Set up JDK 21
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        if: steps.claim.outputs.claimed == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare static validation dependencies
        if: steps.claim.outputs.claimed == 'true'
        run: |
          sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
          ./gradlew --no-daemon :app:testDebugUnitTest :compat-core:test :compat-checker:test :app:assembleDebug

      - name: Set up Node.js
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned Codex CLI and jadx
        if: steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.160.1
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/jadx.zip" \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          printf '%s  %s\n' 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974 "$RUNNER_TEMP/jadx.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          echo "$RUNNER_TEMP/jadx/bin" >> "$GITHUB_PATH"

      - name: Restore verified candidate cache
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ needs.prepare.outputs.cache_dir }}
          key: ${{ needs.prepare.outputs.cache_key }}

      - name: Restore first regression APK
        if: steps.claim.outputs.claimed == 'true' && fromJSON(needs.prepare.outputs.targets)[0] != null
        uses: actions/cache@v6
        with:
          path: .cache/wechat-apks/${{ fromJSON(needs.prepare.outputs.targets)[0].sha256 }}.apk
          key: wechatpad-apk-${{ fromJSON(needs.prepare.outputs.targets)[0].sha256 }}

      - name: Restore second regression APK
        if: steps.claim.outputs.claimed == 'true' && fromJSON(needs.prepare.outputs.targets)[1] != null
        uses: actions/cache@v6
        with:
          path: .cache/wechat-apks/${{ fromJSON(needs.prepare.outputs.targets)[1].sha256 }}.apk
          key: wechatpad-apk-${{ fromJSON(needs.prepare.outputs.targets)[1].sha256 }}

      - name: Revalidate candidate cache and prepare isolated checkout
        if: steps.claim.outputs.claimed == 'true'
        env:
          WECHAT_APK_URL: ${{ needs.prepare.outputs.source_url }}
          WECHAT_APK_CACHE_DIR: ${{ needs.prepare.outputs.cache_dir }}
        run: |
          set -euo pipefail
          expected_sha256="$(jq -r .identity.apkSha256 compatibility-report/candidate-report.json)"
          python3 -m scripts.ci.fetch_latest_wechat_apk \
            --url "$WECHAT_APK_URL" --cache-dir "$WECHAT_APK_CACHE_DIR" \
            --expected-sha256 "$expected_sha256" \
            --github-output "$RUNNER_TEMP/candidate-cache-output" \
            --report "$RUNNER_TEMP/candidate-cache-report.md"
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_adaptation prepare \
            --repository "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json" \
            --apk "$GITHUB_WORKSPACE/$WECHAT_APK_CACHE_DIR/$expected_sha256.apk" \
            --directory "$CODEX_TASK_DIR"

      - name: Restore dedicated managed account authentication
        if: steps.claim.outputs.claimed == 'true'
        id: restore-auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ runner.temp }}/wechatpad-codex-auth
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          auth = json.loads(os.environ['CODEX_AUTH_JSON'])
          if auth.get('auth_mode') != 'chatgpt' or not auth.get('tokens', {}).get('refresh_token'):
              raise SystemExit('CODEX_AUTH_JSON must contain dedicated managed ChatGPT authentication.')
          home = Path(os.environ['CODEX_HOME'])
          home.mkdir(mode=0o700)
          path = home / 'auth.json'
          path.touch(mode=0o600)
          path.write_text(json.dumps(auth))
          PY

      - name: Adapt once with gpt-6-luna and xhigh
        if: steps.claim.outputs.claimed == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/wechatpad-codex-auth
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_adaptation model \
            --directory "$CODEX_TASK_DIR" --prompt "$CONTROLLER_ROOT/adapt-wechat.md"

      - name: Persist refreshed authentication even after model failure
        if: always() && steps.restore-auth.outcome == 'success'
        id: persist-auth
        env:
          CODEX_HOME: ${{ runner.temp }}/wechatpad-codex-auth
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$CODEX_HOME/auth.json"

      - name: Remove runner authentication before validation
        if: always() && steps.restore-auth.outcome == 'success'
        env:
          CODEX_HOME: ${{ runner.temp }}/wechatpad-codex-auth
        run: rm -f "$CODEX_HOME/auth.json"

      - name: Validate adaptation through shared checker and build
        if: success() && steps.claim.outputs.claimed == 'true'
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_adaptation validate --directory "$CODEX_TASK_DIR"

      - name: Export validated runtime inputs
        if: success() && steps.claim.outputs.claimed == 'true'
        run: |
          python3 - <<'PYEXPORT'
          import json, os, shutil
          from pathlib import Path
          task = Path(os.environ['CODEX_TASK_DIR'])
          checkout = Path(json.loads((task / 'state.json').read_text())['worktree'])
          destination = Path('runtime-inputs')
          destination.mkdir()
          shutil.copyfile(checkout / 'app/build/outputs/apk/debug/app-debug.apk', destination / 'app-debug.apk')
          shutil.copyfile(checkout / 'work/apks/candidate.apk', destination / 'wechat.apk')
          shutil.copyfile(task / 'candidate-report.json', destination / 'candidate-report.json')
          PYEXPORT

      - name: Upload validated module APK
        if: success() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-adapted-module
          path: runtime-inputs/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified runtime candidate
        if: success() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-runtime-candidate
          path: |
            runtime-inputs/wechat.apk
            runtime-inputs/candidate-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish statically verified draft PR
        if: success() && steps.claim.outputs.claimed == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task publish \
            --directory "$CODEX_TASK_DIR" --issue '${{ steps.claim.outputs.issue }}'

      - name: Record adaptation failure without retrying
        if: failure() && steps.claim.outputs.claimed == 'true' && steps.publish.outputs.pr_url == ''
        id: adaptation-failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task fail \
            --directory "$CODEX_TASK_DIR" --issue '${{ steps.claim.outputs.issue }}' \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json"

      - name: Add adaptation result to summary
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.publish.outputs.pipeline_status || steps.adaptation-failure.outputs.pipeline_status }}
          ADAPTATION_PR: ${{ steps.publish.outputs.pr_url }}
          CLAIMED: ${{ steps.claim.outputs.claimed }}
          ISSUE_NUMBER: ${{ steps.claim.outputs.issue }}
        run: |
          {
            echo '## Codex adaptation'
            echo '- Model: gpt-6-luna; reasoning: xhigh; one attempt; no custom model timeout.'
            echo "- Status: ${PIPELINE_STATUS:-not started}"
            echo "- Claimed: ${CLAIMED:-false}; issue: ${ISSUE_NUMBER:-none}"
            [[ -z "$ADAPTATION_PR" ]] || echo "- Draft PR: $ADAPTATION_PR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic adaptation result
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-codex-adaptation
          path: |
            ${{ runner.temp }}/wechatpad-adaptation/candidate-report.json
            ${{ runner.temp }}/wechatpad-adaptation/adaptation.patch
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Smoke adapted candidate on hosted AVD
    needs: adapt
    if: needs.adapt.outputs.pr_url != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hosted-lsposed-smoke.yml
    with:
      module_run_id: ${{ github.run_id }}
      module_artifact: wechatpad-adapted-module
      candidate_artifact: wechatpad-runtime-candidate

  runtime-result:
    name: Record runtime acceptance
    needs: [adapt, runtime]
    if: always() && needs.adapt.outputs.pr_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: wechatpad-codex-adaptation
          path: runtime-result
      - name: Download runtime evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hosted-lsposed-smoke
          path: runtime-result/evidence
      - name: Record verified profile or rejection
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTATION_PR: ${{ needs.adapt.outputs.pr_url }}
          TESTED_HEAD: ${{ needs.adapt.outputs.head_sha }}
          ADAPTATION_ISSUE: ${{ needs.adapt.outputs.issue }}
          SMOKE_CONCLUSION: ${{ needs.runtime.result }}
        run: |
          gh auth setup-git
          python3 -m scripts.ci.runtime_task \
            --directory runtime-result \
            --smoke runtime-result/evidence/hosted-lsp/evidence/smoke-report.json \
            --conclusion "$SMOKE_CONCLUSION" --pr "$ADAPTATION_PR" \
            --head "$TESTED_HEAD" --issue "$ADAPTATION_ISSUE"
      - name: Upload pipeline acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-runtime-result
          path: runtime-result/runtime-candidate-report.json
          retention-days: 14
          if-no-files-found: warn
