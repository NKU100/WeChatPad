name: Build module APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install project Android SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Run unit tests and verify module packaging
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew --no-daemon :compat-core:test :compat-checker:test :app:testDebugUnitTest :app:verifyModuleMetadata

      - name: Restore official APK cache
        uses: actions/cache@v5
        with:
          path: .cache/wechat-apks
          key: impad-static-apks-${{ hashFiles('compatibility/wechat/targets.json') }}
          restore-keys: impad-static-apks-

      - name: Run registered-build static regression
        run: python3 -m scripts.ci.static_regression

      - name: Upload static regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: impad-static-regression
          path: work/static-regression/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          WECHATPAD_KEYSTORE_BASE64: ${{ secrets.WECHATPAD_KEYSTORE_BASE64 }}
          WECHATPAD_KEYSTORE_PASSWORD: ${{ secrets.WECHATPAD_KEYSTORE_PASSWORD }}
          WECHATPAD_KEY_ALIAS: ${{ secrets.WECHATPAD_KEY_ALIAS }}
          WECHATPAD_KEY_PASSWORD: ${{ secrets.WECHATPAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          configured_secrets=0
          for value in \
            "$WECHATPAD_KEYSTORE_BASE64" \
            "$WECHATPAD_KEYSTORE_PASSWORD" \
            "$WECHATPAD_KEY_ALIAS" \
            "$WECHATPAD_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured_secrets=$((configured_secrets + 1))
            fi
          done

          if [[ "$configured_secrets" -eq 0 ]]; then
            echo '::warning::ImPad signing Secrets are not configured; using the runner debug key. Reinstall the module to update if the signer changes between runs.'
            ./gradlew --no-daemon :app:assembleDebug
            exit 0
          fi

          if [[ "$configured_secrets" -ne 4 ]]; then
            echo 'Incomplete ImPad signing Secrets: configure all four Secrets or remove them all to use the runner debug key.' >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/wechatpad-signing.jks"
          printf '%s' "$WECHATPAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"

          WECHATPAD_KEYSTORE="$keystore_path" \
          WECHATPAD_KEYSTORE_PASSWORD="$WECHATPAD_KEYSTORE_PASSWORD" \
          WECHATPAD_KEY_ALIAS="$WECHATPAD_KEY_ALIAS" \
          WECHATPAD_KEY_PASSWORD="$WECHATPAD_KEY_PASSWORD" \
            ./gradlew --no-daemon :app:assembleDebug

      - name: Build debug APK with runner debug key
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload module APK
        uses: actions/upload-artifact@v7
        with:
          name: impad-module-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
