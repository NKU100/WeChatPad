name: Build module APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install project Android SDK packages
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'

      - name: Build debug APK with stable signing key
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          WECHATPAD_KEYSTORE_BASE64: ${{ secrets.WECHATPAD_KEYSTORE_BASE64 }}
          WECHATPAD_KEYSTORE_PASSWORD: ${{ secrets.WECHATPAD_KEYSTORE_PASSWORD }}
          WECHATPAD_KEY_ALIAS: ${{ secrets.WECHATPAD_KEY_ALIAS }}
          WECHATPAD_KEY_PASSWORD: ${{ secrets.WECHATPAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$WECHATPAD_KEYSTORE_BASE64" ]] || { echo 'Missing WECHATPAD_KEYSTORE_BASE64' >&2; exit 1; }
          [[ -n "$WECHATPAD_KEYSTORE_PASSWORD" ]] || { echo 'Missing WECHATPAD_KEYSTORE_PASSWORD' >&2; exit 1; }
          [[ -n "$WECHATPAD_KEY_ALIAS" ]] || { echo 'Missing WECHATPAD_KEY_ALIAS' >&2; exit 1; }
          [[ -n "$WECHATPAD_KEY_PASSWORD" ]] || { echo 'Missing WECHATPAD_KEY_PASSWORD' >&2; exit 1; }

          keystore_path="$RUNNER_TEMP/wechatpad-signing.jks"
          printf '%s' "$WECHATPAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"

          WECHATPAD_KEYSTORE="$keystore_path" \
          WECHATPAD_KEYSTORE_PASSWORD="$WECHATPAD_KEYSTORE_PASSWORD" \
          WECHATPAD_KEY_ALIAS="$WECHATPAD_KEY_ALIAS" \
          WECHATPAD_KEY_PASSWORD="$WECHATPAD_KEY_PASSWORD" \
            ./gradlew --no-daemon :app:assembleDebug

      - name: Build debug APK with runner debug key
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload module APK
        uses: actions/upload-artifact@v7
        with:
          name: wechatpad-module-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
