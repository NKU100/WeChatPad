name: Probe locally patched hosted ramdisk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-root-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Download locally patched ramdisk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/root-probe/evidence
          gh release download experimental-ramdisk-api37.2-r06-magisk31.0 \
            --pattern ramdisk37-patched.img --dir work/root-probe
          echo 'b49fec2e291582495196d9437bf520f337882bddf763d2530a576f3e4da99df8  work/root-probe/ramdisk37-patched.img' | sha256sum --check
      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot patched ramdisk and verify Magisk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.2'
          emulator-build: '15917651'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          pre-emulator-launch-script: |
            echo 'a6ee489afea9e28428ceb83d8a0cb55e4ab08cfc755ae2d1f34aff35e1e55038  '"$ANDROID_HOME/system-images/android-37.2/google_apis_ps16k/x86_64/ramdisk.img" | sha256sum --check
            cp work/root-probe/ramdisk37-patched.img "$ANDROID_HOME/system-images/android-37.2/google_apis_ps16k/x86_64/ramdisk.img"
          script: bash scripts/ci/hosted_root_probe.sh
      - name: Upload root evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-root-probe
          path: work/root-probe/evidence/
          retention-days: 7
      - name: Summarize root probe
        if: always()
        run: |
          if [[ -f work/root-probe/evidence/root-verified.txt ]]; then
            echo 'Patched x86_64 ramdisk booted. Magisk daemon and shell su root were verified; LSPosed was not tested.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Root probe did not pass. Inspect emulator logs and root evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
